# FixFlow local stack: the shared infrastructure and the client.
# s1-write, s2-read and mcp-server each add their own entry (see "Docker Compose" in the README).
# First copy .env.example to .env.
name: fixflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Read by docker/postgres/init to create mcp-server's read-only login
      DB_READONLY_USER: ${DB_READONLY_USER:?set DB_READONLY_USER in .env}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?set DB_READONLY_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when postgres-data is empty, i.e. on the first start
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Single-node Kafka in KRaft mode (broker and controller in one process).
  # Containers connect to kafka:29092; apps started on the host connect to localhost:9092.
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MmizBDq8S1a2bxYJRedy-w
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker, so every internal topic has a single replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics come from kafka-init, so a typo or an early consumer can't create a 1-partition topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Creates report.created and report.created.DLT (3 partitions each), then exits.
  # Services that use Kafka should wait for it with condition: service_completed_successfully.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in report.created report.created.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic report.created
    restart: "no"

  # Topics, messages and consumer groups at http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fixflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # The React app, served by Nginx at http://localhost:3000.
  # The browser calls S1 and S2 directly, so their URLs are the ones the host sees.
  client:
    build:
      context: ./client
      args:
        VITE_S1_URL: http://localhost:8081
        VITE_S2_URL: http://localhost:8082
    ports:
      - "3000:80"

volumes:
  postgres-data:
  kafka-data:
  # Uploaded photos. S1 writes and S2 reads them; both mount this volume at /data/images.
  images-data:
