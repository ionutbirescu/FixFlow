name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  client:
    name: Client (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Check the API types match contracts/openapi.yaml
        run: |
          npm run gen:api
          if ! git diff --exit-code -- src/api/schema.gen.ts; then
            echo "::error file=client/src/api/schema.gen.ts::Out of date with contracts/openapi.yaml. Run 'npm run gen:api' in client/ and commit the result."
            exit 1
          fi
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (Compose + client image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check docker-compose.yml
        run: docker compose --env-file .env.example config --quiet
      - name: Build the client image
        run: docker compose --env-file .env.example build client
