server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite gives every built file under /assets a content hash, so browsers can keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router handles the paths: anything that isn't a file gets index.html.
    # no-cache makes browsers check for a new index.html, which points to the new assets.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
